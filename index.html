<style>
:root{color-scheme:light dark;--bg:#F6F7F4;--card:#fff;--ink:#1F2421;--sub:#6B736D;--line:#E4E8E2;--sage:#6F8F74;--sage-d:#4F6F55;--sage-l:#E8EFE6;--hl:#D9E8C9;--warn:#B5644B}
@media (prefers-color-scheme:dark){:root{--bg:#121513;--card:#1B1F1C;--ink:#E7ECE8;--sub:#9AA49D;--line:#2A312C;--sage:#7FA486;--sage-d:#A8CBAE;--sage-l:#243029;--hl:#3B5233;--warn:#E09A82}.chev{stroke:#5D665F}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:40px}
.logo{font-weight:800;font-size:24px;letter-spacing:-.5px;background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 3px}
.logo small{font-weight:500;font-size:13px;color:var(--sub);margin-left:6px;letter-spacing:0}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.back svg{width:20px;height:20px;stroke:var(--ink)}
.crumb{font-size:13px;color:var(--sub)}
.title{font-size:20px;font-weight:700;margin:2px 0 0}
.sec{font-size:13px;font-weight:700;color:var(--sub);margin:22px 4px 10px;letter-spacing:.2px}
.sets{display:grid;gap:10px}
.set{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .08s}
.set:active{transform:scale(.985)}
.ic{width:44px;height:44px;border-radius:14px;background:var(--sage-l);display:grid;place-items:center;flex:none}
.ic svg{width:22px;height:22px;stroke:var(--sage-d)}
.set b{display:block;font-size:16px}
.set span{font-size:13px;color:var(--sub)}
.chev{margin-left:auto;width:18px;height:18px;stroke:#A9B1AB}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.chips.wide{grid-template-columns:1fr}
.chip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px}
.chips.wide .chip{text-align:left;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.on small{color:#E6EEE4}
.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 10px}
.bar .sec{margin:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.no{flex:none;min-width:56px;font-size:14px;font-weight:700;color:var(--sage-d);padding-top:2px}
.ans{flex:1;min-width:0}
.mk{font-size:22px;font-weight:700;letter-spacing:2px;line-height:1.25;word-break:keep-all}
.mk.txt{font-size:15px;letter-spacing:0;font-weight:500;line-height:1.5}
.note{font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:4px;word-break:keep-all}
.note.fix{color:var(--ink);background:var(--sage-l);display:inline-block;padding:3px 8px;border-radius:8px;font-weight:500}
.miss{font-size:14px;color:var(--warn)}
.hint{font-size:12.5px;color:var(--sub);margin:12px 4px 0;line-height:1.6}
.view{will-change:transform,opacity}
.set,.chip,.back{transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s,border-color .25s,color .25s,box-shadow .25s}
.set:active,.chip:active,.back:active{transform:scale(.97)}
button{font-weight:inherit}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.stag{opacity:0;animation:rise .28s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.stag{animation:none;opacity:1}}
.bar{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 10px}
.bar .sec{margin:0}
.toggle{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;color:var(--sub);cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;min-width:112px}
.toggle svg{width:16px;height:16px;stroke:currentColor}
.toggle.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hide .ans{position:relative;cursor:pointer}
.ans > *{transition:opacity .22s ease,filter .22s ease}
.hide .ans:not(.open) > *{opacity:0;filter:blur(4px)}
.hide .ans:not(.open)::after{content:"탭해서 보기";position:absolute;left:0;top:2px;font-size:13px;color:var(--sub);border:1px dashed var(--line);border-radius:8px;padding:4px 10px}
.nav{display:flex;gap:8px;margin-top:14px}
.nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.nav button:active,.toggle:active{transform:scale(.97)}
.toggle{transition:transform .25s cubic-bezier(.2,.8,.2,1),background-color .25s,color .25s,border-color .25s}
.nav button:disabled{opacity:.35}
</style>

 calc:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15l2 2 4-4"/></svg>',
 chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
 eye:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
 eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.8 0 3.3-.5 4.6-1.2"/></svg>'
};
const SETS=[
 {id:'o1',name:'1차 올림포스 변형문제',desc:'강 → 지문 번호 → [1-1] 형식',icon:'book'},
 {id:'o2',name:'2차 올림포스 변형문제',desc:'강 → 번호 구간',icon:'layers'},
 {id:'m1',name:'26년 10월 1차 변형문제',desc:'31~40번 지문별 · 1~120',icon:'cal'},
 {id:'m2',name:'26년 10월 2차 변형문제',desc:'번호 구간 · 1~84',icon:'calc'}
];
const LS=['7','14','16','17'];
let S={view:'home',set:null,lec:null,grp:null,hide:false};
try{S.hide=localStorage.getItem('fin_hide')==='1'}catch(e){}
const app=document.getElementById('app');
const isMk=s=>/^[①②③④⑤ ,]+$/.test(s);
function head(crumb,title){return `<header><button class="back" onclick="goBack()">${I.back}</button><div><div class="crumb">${crumb}</div><div class="title">${title}</div></div></header>`}
function row(no,a,note,fix){
 if(a==null) return `<div class="row stag"><div class="no">${no}</div><div class="ans"><div class="miss">답지에 이 번호가 없어요</div></div></div>`;
 const t=isMk(a)?'mk':'mk txt';
 const n=note?`<div class="note${fix?' fix':''}">${esc(note)}</div>`:'';
 return `<div class="row stag"><div class="no">${no}</div><div class="ans" onclick="this.classList.add('open')"><div class="${t}">${esc(a)}</div>${n}</div></div>`;
}
function hideBtn(){return `<button class="toggle ${S.hide?'on':''}" onclick="toggleHide()">${S.hide?I.eyeoff+'정답 가림':I.eye+'정답 보임'}</button>`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function groups(){
 if(S.set==='o1') return D.o1[S.lec].map(g=>({key:g.no,label:g.no+'번',sub:g.items.length+'문항'}));
 if(S.set==='o2'){const arr=D.o2[S.lec];const out=[];for(let i=0;i<arr.length;i+=10){const a=arr[i][0],b=arr[Math.min(i+9,arr.length-1)][0];out.push({key:i,label:a+'~'+b,sub:(Math.min(i+10,arr.length)-i)+'문항'})}return out}
 if(S.set==='m1') return D.m1.groups.map((g,i)=>({key:i,label:g.label,sub:g.range[0]+'~'+g.range[1]}));
 if(S.set==='m2'){const out=[];for(let i=1;i<=84;i+=10){const b=Math.min(i+9,84);out.push({key:i,label:i+'~'+b,sub:(b-i+1)+'문항'})}return out}
}
let busy=false;
function render(dir){
 const set=SETS.find(s=>s.id===S.set);
 let h='';
 if(S.view==='home'){
  h=`<header><div class="logo">fin.<small>변형문제 답지</small></div></header><div class="sec">문제지 고르기</div><div class="sets">`+
   SETS.map(s=>`<button class="set stag" onclick="pick('${s.id}')"><div class="ic">${I[s.icon]}</div><div><b>${s.name}</b><span>${s.desc}</span></div>${I.chev}</button>`).join('')+`</div>
   <p class="hint">시험지 번호 그대로 고르면 그 번호의 답만 쭉 나와요. 정답 가림을 켜면 채점 전에 하나씩 탭해서 확인할 수 있어요.</p>`;
 } else if(S.view==='lec'){
  h=head('fin.',set.name)+`<div class="sec">강 선택</div><div class="chips">`+
   LS.map(l=>{const n=S.set==='o1'?D.o1[l].reduce((a,g)=>a+g.items.length,0):D.o2[l].length;
    const r=S.set==='o2'?D.o2[l][0][0]+'~'+D.o2[l][D.o2[l].length-1][0]:n+'문항';
    return `<button class="chip stag" onclick="pickLec('${l}')">${l}강<small>${r}</small></button>`}).join('')+`</div>`;
 } else if(S.view==='grp'){
  const gs=groups(); const wide=S.set==='m1';
  h=head(set.name,S.lec?S.lec+'강':'번호 선택')+`<div class="sec">${S.set==='o1'?'시험지 번호 선택':'번호 구간 선택'}</div><div class="chips${wide?' wide':''}">`+
   gs.map(g=>`<button class="chip stag" onclick="pickGrp(${JSON.stringify(g.key)})">${g.label}<small>${g.sub}</small></button>`).join('')+`</div>`;
 } else if(S.view==='ans'){
  const gs=groups(); const idx=gs.findIndex(g=>g.key===S.grp); const g=gs[idx];
  let rows='';
  if(S.set==='o1'){const grp=D.o1[S.lec].find(x=>x.no===S.grp);
   rows=grp.items.map((it,i)=>row(`[${grp.no}-${i+1}]`,it?it[0]:null,it?it[1]:'',false)).join('');}
  else if(S.set==='o2'){rows=D.o2[S.lec].slice(S.grp,S.grp+10).map(([n,a])=>row(n+'.',a,'',false)).join('');}
  else if(S.set==='m1'){const [a,b]=D.m1.groups[S.grp].range;for(let n=a;n<=b;n++){const [x,nt]=D.m1.ans[n];rows+=row(n+')',x,nt,!!nt)}}
  else {for(let n=S.grp;n<=Math.min(S.grp+9,84);n++){const [x,nt]=D.m2[n-1];rows+=row(n+')',x,nt,false)}}
  const title=S.set==='o1'?S.lec+'강 '+S.grp+'번':(S.lec?S.lec+'강 ':'')+g.label;
  h=head(set.name,title)+`<div class="bar"><div class="sec">정답</div>${hideBtn()}</div><div class="list ${S.hide?'hide':''}">${rows}</div>
   <div class="nav"><button ${idx<=0?'disabled':''} onclick="pickGrp(${JSON.stringify(gs[idx-1]?.key??null)},-1)">‹ ${gs[idx-1]?gs[idx-1].label.replace(/^Section \d · /,''):'처음'}</button><button ${idx>=gs.length-1?'disabled':''} onclick="pickGrp(${JSON.stringify(gs[idx+1]?.key??null)},1)">${gs[idx+1]?gs[idx+1].label.replace(/^Section \d · /,''):'끝'} ›</button></div>`;
 }
 swap(h,dir||0);
}
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function swap(h,dir){
 const old=app.querySelector('.view');
 const put=()=>{
  app.innerHTML='<div class="view">'+h+'</div>';
  const v=app.querySelector('.view');
  v.querySelectorAll('.stag').forEach((el,i)=>el.style.animationDelay=Math.min(i*15,180)+'ms');
  window.scrollTo({top:0});
  if(!RM&&dir) v.animate([{opacity:0,transform:`translateX(${dir*18}px)`},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.8,.2,1)'});
  else if(!RM) v.animate([{opacity:0},{opacity:1}],{duration:180,easing:'ease'});
 };
 if(!old||RM){put();return}
 busy=true;
 const a=old.animate([{opacity:1,transform:'none'},{opacity:0,transform:`translateX(${-dir*14}px)`}],{duration:90,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
 let done=false;const fin=()=>{if(done)return;done=true;busy=false;put()};a.onfinish=fin;setTimeout(fin,110);
}
function pick(id){if(busy)return;S.set=id;S.lec=null;S.grp=null;S.view=(id==='o1'||id==='o2')?'lec':'grp';render(1)}
function pickLec(l){if(busy)return;S.lec=l;S.view='grp';render(1)}
function pickGrp(k,d){if(k===null||busy)return;S.grp=k;S.view='ans';render(d||1)}
function toggleHide(){S.hide=!S.hide;try{localStorage.setItem('fin_hide',S.hide?'1':'0')}catch(e){}
 const l=app.querySelector('.list'); if(l){l.querySelectorAll('.ans.open').forEach(a=>a.classList.remove('open'));l.classList.toggle('hide',S.hide)}
 const b=app.querySelector('.toggle'); if(b){b.classList.toggle('on',S.hide);b.innerHTML=S.hide?I.eyeoff+'정답 가림':I.eye+'정답 보임'}}
function goBack(){if(busy)return;if(S.view==='ans')S.view='grp';else if(S.view==='grp')S.view=S.lec?'lec':'home';else S.view='home';if(busy)return;if(S.view==='lec')S.lec=null;render(-1)}
render();
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
</body>
</html>
